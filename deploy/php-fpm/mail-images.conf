[mail-images]
user = www-data
group = www-data
listen = 9001
; Slow image hosts must not occupy the workers that serve the mailbox itself.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
request_terminate_timeout = 12s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
