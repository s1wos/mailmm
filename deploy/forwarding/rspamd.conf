# This instance only signs submissions. Ingress filtering remains independent.
.include "$CONFDIR/modules.d/dkim.conf"
modules {
  path = "$PLUGINSDIR/dkim_signing.lua";
  path = "$PLUGINSDIR/arc.lua";
}
lua = "/etc/mailmm-forwarding/policy.lua";
options {
  .include "$CONFDIR/options.inc"
}
logging { type = "console"; level = "warning"; }
worker "rspamd_proxy" {
  bind_socket = "127.0.0.1:11332";
  count = 1;
  milter = yes;
  timeout = 15s;
  upstream "local" { default = yes; self_scan = yes; }
}
dkim_signing {
  use_milter_headers = true;
  sign_condition = "return function(task) return mailmm_signing_key(task, 'mailmm-manual') end";
}
arc {
  reuse_auth_results = true;
  sign_condition = "return function(task) return mailmm_signing_key(task, 'mailmm-auto') end";
}
