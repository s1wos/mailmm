map $host $mailmm_hsts {
    default "";
    mailmm.my "max-age=31536000";
}

server {
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;
    root /var/www/public;
    ssl_certificate /etc/letsencrypt/live/mailmm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailmm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security $mailmm_hsts always;
    include /etc/nginx/mailmm/locations.conf;
}
