resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream mailmm_php {
    zone mailmm_php 64k;
    server app:9000 resolve;
}

upstream mailmm_images {
    zone mailmm_images 64k;
    server app:9001 resolve;
}

upstream mailmm_reverb {
    zone mailmm_reverb 64k;
    server reverb:8080 resolve;
}
